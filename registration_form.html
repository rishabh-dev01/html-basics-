<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REGISTRATION_FORM</title>
</head>
<body>
    <h1>REGISTRATION FORM</h1>
    <form>
        <label for="first name">first name :</label>
        <textarea id="first name " name="first name" placeholder=" first name"></textarea> 
        <label for="last name">last name :</label>
        <textarea id="last name " name="last name" placeholder="last name"></textarea> 
        <div>
            PLEASE SELECT YOUR GENDER :
            <select name="gender" id="gender">
                <option value="select">select</option>
                <option value="male">male</option>
                <option value="female">female</option>
                <option value="other">other</option>
            </select>
        </div>
        <div>
            Do you agree to all terms of services? 
            <input type="checkbox" name="yes">
            <label for="yes">Yes, I agree.</label>
        </div>
        <button type="submit">register</button>

    </form>
    
</body>
</html>
